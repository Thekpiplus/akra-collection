name: Publish static site

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish out/ to hostinger branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: hostinger
          clean: true
          commit-message: Publish static site for Hostinger
